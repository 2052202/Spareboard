<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body style=" background-color: #121212;
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center; 
      align-items: center;     ">
    <style>.loader { display: inline-flex; gap: 5px; animation: l2-0 1s infinite linear; } .loader:before, .loader:after { content: ""; width: 35px; aspect-ratio: 1; box-shadow: 0 0 0 3px inset #fff; animation: l2-1 1s infinite linear both; } .loader:after { animation-direction:reverse; } @keyframes l2-0{ 0% {transform:rotate(0deg)} 80%, 100%{transform:rotate(180deg)} } @keyframes l2-1{ 0%, 20%  {border-radius:0} 80%, 100% {border-radius:50%} }</style>
    <div class="loader"></div>
    <script>
        setTimeout(() => {
            window.location.replace("./index.html")
        }, 500)
    </script>
</body>
</html>
